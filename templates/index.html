<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSP Route Optimizer - Smart Trash Management</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="title-section">
                    <h1>
                        <i class="fas fa-route"></i>
                        TSP Route Optimizer
                    </h1>
                    <p>
                        <i class="fas fa-map-marked-alt"></i>
                        ระบบคำนวณเส้นทางเก็บขยะที่เหมาะสมที่สุด • 
                        <span id="lastUpdate">กำลังโหลด...</span>
                    </p>
                </div>
                <div class="stats-section">
                    <div class="stat-card">
                        <div class="stat-value" id="totalBins">0</div>
                        <div class="stat-label">ถังทั้งหมด</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="fullBins">0</div>
                        <div class="stat-label">ถังเต็ม (≥80%)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="warningBins">0</div>
                        <div class="stat-label">เกือบเต็ม (50-79%)</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" onclick="calculateRoute()">
                <i class="fas fa-calculator"></i> คำนวณเส้นทาง
            </button>
            <button class="btn btn-success" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> รีเฟรชข้อมูล
            </button>
            <button class="btn btn-warning" onclick="simulateData()">
                <i class="fas fa-flask"></i> ทดสอบระบบ
            </button>
            <button class="btn btn-danger" onclick="clearAllData()">
                <i class="fas fa-trash-alt"></i> ล้างข้อมูล
            </button>
        </div>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- Route Information -->
        <div class="route-info" id="routeInfo" style="display: none;">
            <div class="route-header">
                <div class="route-title">
                    <i class="fas fa-map-signals"></i>
                    <span>เส้นทางที่เหมาะสมที่สุด</span>
                </div>
                <div class="route-stats" id="routeStats">
                    <div class="route-stat">
                        <div class="value" id="totalDistance">0</div>
                        <div class="label">ระยะทาง (กม.)</div>
                    </div>
                    <div class="route-stat">
                        <div class="value" id="estimatedTime">0</div>
                        <div class="label">เวลาโดยประมาณ (นาที)</div>
                    </div>
                </div>
            </div>
            <div class="route-list" id="routeList"></div>
        </div>

        <!-- Bins Grid -->
        <div class="bins-grid" id="binsGrid"></div>

        <!-- Footer -->
        <div class="footer">
            <p>
                <i class="fas fa-route"></i> TSP Route Optimizer API • 
                <i class="fas fa-code"></i> © 2024 Smart Trash Management System •
                <i class="fas fa-map-pin"></i> ระดับสี: 
                <span style="color: #27ae60">🟢 0-49%</span> •
                <span style="color: #f39c12">🟡 50-79%</span> •
                <span style="color: #ff3838">🔴 80-100%</span>
            </p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script src="/static/js/script.js"></script>
</body>
</html>
